[package]
name = "saku-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Saku agent harness: tools, provider, session store, credentials"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
dirs = "6"
fff-search = "0.9.7-nightly.fce72fa"
fs4 = "0.13"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mime_guess = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "test-util"] }
