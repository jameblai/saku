[package]
name = "saku-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Saku Discord adapter (Serenity)"

[dependencies]
saku-harness = { workspace = true }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "http", "rustls_backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
