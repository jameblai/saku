[package]
name = "saku-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Saku agent harness: tools, provider, session store, credentials"

[dependencies]
async-trait = "0.1"
dirs = "6"
fs4 = "0.13"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "test-util"] }
