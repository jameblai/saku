name: Release

on:
  push:
    tags: ['v*.*.*', '!v*-nightly.*']
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, nightly]
      version:
        description: Stable version (for example 0.1.0)
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            tag="$REF_NAME"; prerelease=false
          elif [[ "$EVENT" == workflow_dispatch && "$CHANNEL" == stable ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'version is required as X.Y.Z' >&2; exit 1; }
            tag="v$VERSION"; prerelease=false
          else
            base=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            tag="v${base}-nightly.$(date -u +%Y%m%d).${RUN_NUMBER}"
            prerelease=true
            last=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -1)
            if [[ -n "$last" && "$(git rev-list -n1 "$last")" == "$GITHUB_SHA" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - run: cross build --release -p saku --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/saku dist/saku
          tar -C dist -czf saku-linux-${{ matrix.arch }}.tar.gz saku
      - uses: actions/upload-artifact@v4
        with:
          name: saku-linux-${{ matrix.arch }}
          path: saku-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum saku-linux-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          args=(--title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$TAG" dist/* "${args[@]}"
