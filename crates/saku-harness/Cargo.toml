[package]
name = "saku-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Saku agent harness: tools, provider, session store, credentials"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
dirs = "6"
libc = "0.2"
fff-search = "0.9.7-nightly.b4590ca"
futures = "0.3"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mime_guess = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
toml = "1"
url = "2"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "test-util"] }
wiremock = "0.6.5"
